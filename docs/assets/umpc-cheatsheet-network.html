<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The University of Melbourne Perpetual Calendar | Sigma.js Network Visualisation</title>
    <style>
        :root {
            --panel-bg: rgba(12, 12, 14, 0.72);
            --panel-border: rgba(255, 255, 255, 0.06);
            --panel-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --panel-radius: 10px;
            --accent: #4ECDC4;
            --accent-dim: rgba(78, 205, 196, 0.35);
            --text-primary: #d8dade;
            --text-secondary: #9ecfcc;
            --text-muted: #a89860;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code',
                    'Droid Sans Mono', 'Source Code Pro', Menlo, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                    sans-serif;
        }

        /* ----------------------------------------------------------------
           Light theme overrides
        ---------------------------------------------------------------- */
        [data-theme="light"] {
            --panel-bg: rgba(255, 255, 255, 0.78);
            --panel-border: rgba(0, 0, 0, 0.08);
            --panel-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            --accent: #2BA89E;
            --accent-dim: rgba(43, 168, 158, 0.25);
            --text-primary: #1a1a2e;
            --text-secondary: #4a4e59;
            --text-muted: #8a8e95;
        }

        [data-theme="light"] body {
            background: #f0f1f3;
            color: var(--text-primary);
        }

        [data-theme="light"] #sigma-container {
            background: #f0f1f3;
        }

        [data-theme="light"] #info .btn {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] #info .btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        [data-theme="light"] #details h4 {
            border-bottom-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] .legend-swatch {
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] #legend::-webkit-scrollbar-thumb,
        [data-theme="light"] #details::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111113;
            font-family: var(--sans);
            color: var(--text-primary);
            overflow: hidden;
        }

        #sigma-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
        }

        /* ----------------------------------------------------------------
           Status bar — bottom-right
        ---------------------------------------------------------------- */
        #info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--panel-radius);
            padding: 8px 14px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--text-secondary);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--panel-shadow);
            transition: border-color 0.4s ease;
        }

        #info.layout-active {
            border-color: var(--accent-dim);
        }

        #status { white-space: nowrap; }

        #info .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            padding: 3px 9px;
            font-family: var(--sans);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
            letter-spacing: 0.01em;
        }

        #info .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        #info .btn.active {
            background: var(--accent-dim);
            border-color: rgba(78, 205, 196, 0.4);
            color: #fff;
        }

        #info .btn:disabled {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
        }

        /* ----------------------------------------------------------------
           Type legend — bottom-left
        ---------------------------------------------------------------- */
        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--panel-radius);
            padding: 14px 16px 10px;
            font-size: 11px;
            color: var(--text-secondary);
            z-index: 1000;
            max-height: 38vh;
            overflow-y: auto;
            box-shadow: var(--panel-shadow);
        }

        /* Scrollbar */
        #legend::-webkit-scrollbar { width: 4px; }
        #legend::-webkit-scrollbar-track { background: transparent; }
        #legend::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-family: var(--sans);
            font-size: 11.5px;
            letter-spacing: 0.01em;
        }

        .legend-swatch {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.08);
        }

        /* ----------------------------------------------------------------
           Node details panel — top-right
        ---------------------------------------------------------------- */
        #details {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: var(--panel-radius);
            padding: 16px 18px;
            max-width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            font-size: 12px;
            box-shadow: var(--panel-shadow);
            animation: panelIn 0.2s ease-out;
        }

        @keyframes panelIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        #details::-webkit-scrollbar { width: 4px; }
        #details::-webkit-scrollbar-track { background: transparent; }
        #details::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        #details h4 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            letter-spacing: -0.01em;
        }

        .detail-row {
            padding: 4px 0;
            color: var(--text-secondary);
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.5;
        }

        .detail-label {
            font-family: var(--sans);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .detail-section {
            margin-top: 14px;
        }

        .detail-section:first-of-type {
            margin-top: 10px;
        }

        .detail-subhead {
            font-family: var(--sans);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 4px;
        }

        [data-theme="light"] .detail-subhead {
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        .detail-link {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

        .detail-link:hover {
            text-decoration: underline;
        }

        .detail-group {
            margin-top: 8px;
        }

        .detail-group-label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div id="sigma-container"></div>

    <div id="info">
        <button id="btn-theme" class="btn" style="display:inline-block">Light</button>
        <span class="separator" style="color:var(--panel-border)">|</span>
        <span id="status">Initialising&hellip;</span>
        <button id="btn-toggle" class="btn">Start FA2</button>
        <button id="btn-stop" class="btn">Stop</button>
    </div>

    <div id="legend"></div>

    <div id="details"></div>
