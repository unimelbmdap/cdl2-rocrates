    // State
    let Graph3D = null;
    let isDarkMode = false;
    let isRotating = false;
    let rotationAnimationId = null;
    const highlightedNodes = new Set();
    const highlightedLinks = new Set();
    var nodeColourMap = {};
    var colourEdgesBySource = false;

    // HTML escaping to prevent XSS from entity data.
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(text)));
        return div.innerHTML;
    }

    // Tooltip builder
    function buildTooltip(title, properties) {
        let html = '<div style="color: #1a1a1a; background: rgba(255, 255, 255, 0.95); ' +
                   'padding: 8px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">' +
                   '<b style="font-size: 14px;">' + escapeHtml(title) + '</b>';

        if (properties && Object.keys(properties).length > 0) {
            html += '<br/><span style="font-size: 12px;">';
            for (const [key, value] of Object.entries(properties)) {
                html += escapeHtml(key) + ': ' + escapeHtml(value) + '<br/>';
            }
            html += '</span>';
        }

        html += '</div>';
        return html;
    }

    // Initialise graph
    document.addEventListener('DOMContentLoaded', function() {
        if (!graphData.nodes || graphData.nodes.length === 0) {
            document.getElementById('graph-3d').innerHTML =
                '<div style="padding: 20px;">No network data available</div>';
            return;
        }

        // Build a colour lookup map so linkColor works before d3-force resolves references.
        graphData.nodes.forEach(function(n) { nodeColourMap[n.id] = n.color; });

        Graph3D = ForceGraph3D()
            (document.getElementById('graph-3d'))
            .graphData(graphData)

            // Nodes
            .nodeLabel(function(node) {
                var props = Object.assign({}, node.properties || {});
                props['Connections'] = node.degree;
                return buildTooltip(node.name, props);
            })
            .nodeVal(function(node) { return node.val / 2; })
            .nodeColor(function(node) { return node.color; })
            .nodeOpacity(0.9)
            .nodeResolution(16)

            // Links
            .linkLabel(function(link) {
                var props = Object.assign({type: link.type}, link.properties || {});
                return buildTooltip('Edge', props);
            })
            .linkWidth(function(link) { return link.width != null ? link.width : 0.4; })
            .linkColor(function(link) {
                var fallback = isDarkMode ? '#7DBAED' : '#5B9BD5';
                if (!colourEdgesBySource) return fallback;
                var srcId = link.source.id !== undefined ? link.source.id : link.source;
                return nodeColourMap[srcId] || fallback;
            })
            .linkCurvature(0.25)
            .linkCurveRotation(0)
            .linkDirectionalArrowLength(0)
            .linkOpacity(0.2)

            // Scene
            .backgroundColor('#f5f5f5')

            // Interaction
            .onNodeHover(function(node) {
                document.body.style.cursor = node ? 'pointer' : 'default';
            })
            .onNodeClick(function(node) {
                if (node) showNodeDetails(node);
            })
            .onBackgroundClick(function() {
                hideNodeDetails();
            });

        // Spread nodes out — reduce centre gravity, increase repulsion.
        Graph3D.d3Force('charge').strength(-120);
        Graph3D.d3Force('center').strength(0.03);
        var linkForce = Graph3D.d3Force('link');
        if (linkForce) {
            linkForce.distance(60);
        }
    });

    // Node click: show details + highlight neighbourhood
    function showNodeDetails(node) {
        if (!Graph3D || !graphData) return;

        highlightedNodes.clear();
        highlightedLinks.clear();
        highlightedNodes.add(node.id);

        // Find neighbours
        var neighbours = [];
        graphData.links.forEach(function(link) {
            var otherNodeId = null;
            var direction = '';

            if ((link.source.id !== undefined ? link.source.id : link.source) === node.id) {
                otherNodeId = link.target.id !== undefined ? link.target.id : link.target;
                direction = 'to';
            } else if ((link.target.id !== undefined ? link.target.id : link.target) === node.id) {
                otherNodeId = link.source.id !== undefined ? link.source.id : link.source;
                direction = 'from';
            }

            if (otherNodeId !== null) {
                highlightedNodes.add(otherNodeId);
                highlightedLinks.add(link);

                var otherNode = graphData.nodes.find(function(n) { return n.id === otherNodeId; });
                if (otherNode) {
                    neighbours.push({
                        name: otherNode.name,
                        direction: direction,
                        linkProperties: link.properties || {}
                    });
                }
            }
        });

        applyHighlighting();
        updateDetailsPanel(node, neighbours);
    }

    function updateDetailsPanel(node, neighbours) {
        var panel = document.getElementById('details-panel');
        if (!panel) return;

        var html = '<h6><span>' + escapeHtml(node.name) + '</span>' +
            '<button onclick="hideNodeDetails()" ' +
            'style="background: none; border: none; font-size: 18px; ' +
            'cursor: pointer; color: #999; padding: 0; line-height: 1;">&times;</button></h6>';

        // Show node properties
        if (node.properties && Object.keys(node.properties).length > 0) {
            for (var key in node.properties) {
                html += '<div class="detail-row"><span class="detail-label">' +
                    escapeHtml(key) + ':</span> ' + escapeHtml(node.properties[key]) + '</div>';
            }
        }

        html += '<div class="detail-row"><span class="detail-label">Connections:</span> ' +
            node.degree + '</div>';

        // Show neighbours
        if (neighbours.length > 0) {
            html += '<div style="margin-top: 12px; border-top: 1px solid #e0e0e0; padding-top: 8px;">';
            html += '<div style="font-size: 12px; font-weight: 600; color: #666; ' +
                'text-transform: uppercase; margin-bottom: 4px;">Neighbours</div>';
            neighbours.forEach(function(n) {
                var arrow = n.direction === 'to' ? '&rarr;' : '&larr;';
                html += '<div class="neighbour-item">' + arrow + ' ' + escapeHtml(n.name) + '</div>';
            });
            html += '</div>';
        }

        panel.innerHTML = html;
        panel.style.display = 'block';
    }

    function hideNodeDetails() {
        highlightedNodes.clear();
        highlightedLinks.clear();
        applyHighlighting();

        var panel = document.getElementById('details-panel');
        if (panel) panel.style.display = 'none';
    }

    // Highlighting
    function applyHighlighting() {
        if (!Graph3D) return;

        var hasHighlight = highlightedNodes.size > 0;

        Graph3D.nodeColor(function(node) {
            if (!hasHighlight) return node.color;
            if (highlightedNodes.has(node.id)) return node.color;
            return isDarkMode ? '#505050' : '#d0d0d0';
        });

        Graph3D.linkColor(function(link) {
            var fallback = isDarkMode ? '#7DBAED' : '#5B9BD5';
            var srcColour = fallback;
            if (colourEdgesBySource) {
                var srcId = link.source.id !== undefined ? link.source.id : link.source;
                srcColour = nodeColourMap[srcId] || fallback;
            }
            if (!hasHighlight) return srcColour;
            if (highlightedLinks.has(link)) return srcColour;
            return isDarkMode ? '#606060' : '#e8e8e8';
        }).linkWidth(function(link) {
            var base = link.width != null ? link.width : 0.4;
            if (!hasHighlight) return base;
            return highlightedLinks.has(link) ? base * 2 : 0.2;
        });

        if (hasHighlight) {
            Graph3D.linkOpacity(1).linkMaterial(function(link) {
                var opacity;
                if (isDarkMode) {
                    opacity = highlightedLinks.has(link) ? 0.7 : 0.05;
                } else {
                    opacity = highlightedLinks.has(link) ? 0.5 : 0.03;
                }
                return new THREE.MeshLambertMaterial({
                    transparent: true,
                    opacity: opacity
                });
            });
        } else {
            Graph3D.linkOpacity(isDarkMode ? 0.3 : 0.2)
                .linkMaterial(null);
        }
    }

    // Dark mode
    function toggleDarkMode() {
        if (!Graph3D) return;
        isDarkMode = !isDarkMode;

        var button = document.getElementById('dark-mode-toggle');
        var rotateControl = document.getElementById('rotate-control');

        if (isDarkMode) {
            Graph3D.backgroundColor('#1a1a1a');
            button.textContent = 'Light Mode';
            button.classList.remove('dark');
            rotateControl.classList.add('dark');
        } else {
            Graph3D.backgroundColor('#f5f5f5');
            button.textContent = 'Dark Mode';
            button.classList.add('dark');
            rotateControl.classList.remove('dark');
        }

        Graph3D.refresh();
        applyHighlighting();
    }

    // Auto-rotation
    function toggleRotation() {
        if (!Graph3D) return;
        isRotating = document.getElementById('rotate-checkbox').checked;
        if (isRotating) startRotation();
        else stopRotation();
    }

    function startRotation() {
        var initialPos = Graph3D.cameraPosition();
        var distance = Math.sqrt(
            initialPos.x * initialPos.x + initialPos.y * initialPos.y + initialPos.z * initialPos.z
        );
        var initialY = initialPos.y;
        var angle = Math.atan2(initialPos.x, initialPos.z) * 180 / Math.PI;

        function rotate() {
            if (!isRotating) return;
            angle += 0.3;

            Graph3D.cameraPosition({
                x: distance * Math.sin(angle * Math.PI / 180),
                y: initialY,
                z: distance * Math.cos(angle * Math.PI / 180)
            }, null, 0);

            rotationAnimationId = requestAnimationFrame(rotate);
        }

        rotate();
    }

    function stopRotation() {
        if (rotationAnimationId) {
            cancelAnimationFrame(rotationAnimationId);
            rotationAnimationId = null;
        }
    }
    </script>
