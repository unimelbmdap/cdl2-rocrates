site_name: RO-Crate Analysis and Visualisation Tools
site_description: Tools for analysing and visualising research data collections stored in RO-Crates
site_url: https://unimelbmdap.github.io/cdl2-rocrates/
repo_url: https://github.com/unimelbmdap/cdl2-rocrates
repo_name: unimelbmdap/cdl2-rocrates

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

exclude_docs: |
  plans/

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
    - Overview: tutorials/index.md
    - From Graph to DataFrame: tutorials/from-graph-to-dataframe.md
    - Exploring Temporal Dimensions: tutorials/exploring-temporal-dimensions.md
    - Mapping a Collection's Places: tutorials/mapping-collection-places.md
    - Basic NLP with Text Records: tutorials/basic-nlp-with-text-records.ipynb
  - User Stories:
    - Overview: user-stories/index.md
    - "Walkthrough: The Wallaby Club": user-stories/walkthrough-wall-club.ipynb
  - Architecture: architecture.md
  - API Reference:
    - Overview: api/index.md
    - Graph & Crate: api/graph.md
    - Data Models: api/models.md
    - Type Discovery: api/types.md
    - Plugin Interfaces: api/interfaces.md
  - Resources: resources.md
  - Acknowledgements: acknowledgements.md
