[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crategraph"
version = "0.1.0"
description = "Researcher-friendly tools for loading, exploring, and visualising RO-Crate data as network graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grand-cypher>=1.0",
    "markupsafe>=2.1",
    "networkx>=3.4",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
pyvis = ["pyvis>=0.3"]
forceatlas = ["crategraph-forceatlas2>=0.1"]
rdf = ["rdflib>=7.0"]
inspect = ["markitdown[all]>=0.1"]
ohrm = ["pandas>=2.0"]
okf = [
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
]
index = [
    "crategraph[inspect]",
    "fastembed>=0.3",
    "sqlite-vec>=0.1",
    "tokenizers>=0.15",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "crategraph-forceatlas2>=0.1",
    "hypothesis>=6.0",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.6.21",
    "mkdocstrings-python>=1.14.1",
    "mkdocstrings>=0.30.1",
    "pre-commit>=4.0.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 99
# Draft tutorials are work-in-progress; exclude from linting/formatting so CI
# agrees with the .pre-commit-config.yaml exclusion of docs/tutorials/draft/.
extend-exclude = ["docs/tutorials/draft"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
