[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crategraph"
version = "0.1.3"
description = "Researcher-friendly tools for loading, exploring, and visualising RO-Crate data as network graphs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Melbourne Data Analytics Platform" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Sociology :: History",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "crategraph-forceatlas2>=0.1",
    "grand-cypher>=1.0",
    "markupsafe>=2.1",
    "networkx>=3.4",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dateutil>=2.8",
    "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://unimelbmdap.github.io/cdl2-rocrates/"
Documentation = "https://unimelbmdap.github.io/cdl2-rocrates/"
Source = "https://github.com/unimelbmdap/cdl2-rocrates"
Issues = "https://github.com/unimelbmdap/cdl2-rocrates/issues"

[project.optional-dependencies]
pyvis = ["pyvis>=0.3"]
rdf = ["rdflib>=7.0"]
inspect = ["markitdown[all]>=0.1"]
ohrm = ["pandas>=2.0"]
okf = [
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
]
index = [
    "crategraph[inspect]",
    "fastembed>=0.3",
    "sqlite-vec>=0.1",
    "tokenizers>=0.15",
    "tqdm>=4.65",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "mkdocs-jupyter>=0.25",
    "mkdocs-material>=9.6.21",
    "mkdocstrings-python>=1.14.1",
    "mkdocstrings>=0.30.1",
    "pre-commit>=4.0.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.sdist]
# Ship only the package and its tests. Without an explicit allowlist, hatchling
# walks the whole project directory and bundles local working data: chiefly the
# generated graph exports under scripts/grids/crate-explorer/output*/, which are
# hundreds of megabytes and include NonCommercial-licensed collections. Those
# are ignored via the nested scripts/grids/.gitignore, but nested ignore files
# are not honoured during sdist file selection, so list contents explicitly.
# pyproject.toml, README.md and LICENSE are always included by hatchling.
include = [
    "crategraph/",
    "tests/",
]

[tool.hatch.build.targets.wheel]
packages = ["crategraph"]

[tool.ruff]
target-version = "py312"
line-length = 99
# Draft tutorials are work-in-progress; exclude from linting/formatting so CI
# agrees with the .pre-commit-config.yaml exclusion of docs/tutorials/draft/.
extend-exclude = ["docs/tutorials/draft"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
