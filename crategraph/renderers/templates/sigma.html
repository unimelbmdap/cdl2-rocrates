<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma.js Network Visualisation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        #sigma-container {
            position: absolute;
            top: 0;
            left: 0;
            width: %(width)s;
            height: %(height)s;
        }

        /* Status bar (bottom-right) */
        #info {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            color: #aaa;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #info #status-text {
            white-space: nowrap;
        }

        #info .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: none;
        }

        #info .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        #info .btn.active {
            background: rgba(78, 121, 167, 0.5);
            border-color: rgba(78, 121, 167, 0.7);
            color: #fff;
        }

        /* Type legend (bottom-left) */
        #legend {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #ccc;
            z-index: 1000;
            max-height: 40vh;
            overflow-y: auto;
        }

        #legend h4 {
            margin: 0 0 8px 0;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%%;
            flex-shrink: 0;
        }

        .legend-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        /* Node details panel (top-right) */
        #details {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            max-width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            font-size: 13px;
        }

        #details h5 {
            margin: 0 0 10px 0;
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #details .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
            padding: 0;
            line-height: 1;
        }

        #details .close-btn:hover {
            color: #fff;
        }

        .detail-row {
            padding: 3px 0;
            color: #bbb;
        }

        .detail-key {
            font-weight: 600;
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .detail-val {
            color: #ddd;
        }

        .neighbour-section {
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
        }

        .neighbour-heading {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 4px;
        }

        .neighbour-item {
            padding: 3px 0;
            border-left: 3px solid #4e79a7;
            padding-left: 8px;
            margin-bottom: 2px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="sigma-container"></div>

    <div id="info">
        <span id="status-text">Initialising&hellip;</span>
        <button id="btn-toggle" class="btn" onclick="toggleAnimation()">Start FA2</button>
        <button id="btn-stop" class="btn" onclick="stopAnimation()">Stop</button>
    </div>

    <div id="legend"></div>

    <div id="details"></div>

    <!-- Vendored Sigma.js + graphology + FA2 bundle -->
    <script>%(bundle)s</script>

    <script>
    /* ---- Globals injected by Python renderer ---- */
    window.graphData  = %(graph_data)s;
    window.typeColours = %(type_colours)s;
    window.sigmaConfig = %(config)s;

    /* ---- State ---- */
    var renderer = null;
    var sigmaGraph = null;
    var fa2Layout = null;
    var fa2Running = false;
    var hoveredNode = null;
    var selectedNode = null;
    var hoveredNeighbours = new Set();

    /* ---- HTML escaping ---- */
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(text)));
        return div.innerHTML;
    }

    /* ---- Build legend ---- */
    function buildLegend() {
        var container = document.getElementById('legend');
        if (!window.typeColours || Object.keys(window.typeColours).length === 0) {
            container.style.display = 'none';
            return;
        }
        var html = '<h4>Types</h4>';
        for (var typeName in window.typeColours) {
            var colour = window.typeColours[typeName];
            html += '<div class="legend-item">' +
                '<span class="legend-swatch" style="background:' + colour + ';"></span>' +
                '<span class="legend-label">' + escapeHtml(typeName) + '</span>' +
                '</div>';
        }
        container.innerHTML = html;
    }

    /* ---- Details panel ---- */
    function showDetails(nodeKey) {
        var panel = document.getElementById('details');
        if (!sigmaGraph || !sigmaGraph.hasNode(nodeKey)) return;

        var attrs = sigmaGraph.getNodeAttributes(nodeKey);
        var html = '<h5><span>' + escapeHtml(attrs.label || nodeKey) + '</span>' +
            '<button class="close-btn" onclick="hideDetails()">&times;</button></h5>';

        html += '<div class="detail-row"><span class="detail-key">ID:</span> ' +
            '<span class="detail-val">' + escapeHtml(nodeKey) + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Type:</span> ' +
            '<span class="detail-val">' + escapeHtml(attrs.entityType || '') + '</span></div>';
        html += '<div class="detail-row"><span class="detail-key">Connections:</span> ' +
            '<span class="detail-val">' + (attrs.degree || 0) + '</span></div>';

        /* Neighbours */
        var neighbours = sigmaGraph.neighbors(nodeKey);
        if (neighbours.length > 0) {
            html += '<div class="neighbour-section">';
            html += '<div class="neighbour-heading">Neighbours (' + neighbours.length + ')</div>';
            neighbours.forEach(function(nKey) {
                var nAttrs = sigmaGraph.getNodeAttributes(nKey);
                html += '<div class="neighbour-item">' + escapeHtml(nAttrs.label || nKey) + '</div>';
            });
            html += '</div>';
        }

        panel.innerHTML = html;
        panel.style.display = 'block';
    }

    function hideDetails() {
        selectedNode = null;
        document.getElementById('details').style.display = 'none';
        resetHighlighting();
    }

    /* ---- Neighbourhood highlighting ---- */
    function highlightNode(nodeKey) {
        hoveredNeighbours = new Set(sigmaGraph.neighbors(nodeKey));
        hoveredNeighbours.add(nodeKey);

        sigmaGraph.forEachNode(function(key, attrs) {
            if (hoveredNeighbours.has(key)) {
                sigmaGraph.setNodeAttribute(key, 'highlighted', true);
            } else {
                sigmaGraph.setNodeAttribute(key, 'highlighted', false);
            }
        });

        renderer.refresh();
    }

    function resetHighlighting() {
        hoveredNeighbours = new Set();
        if (sigmaGraph) {
            sigmaGraph.forEachNode(function(key) {
                sigmaGraph.setNodeAttribute(key, 'highlighted', true);
            });
            renderer.refresh();
        }
    }

    /* ---- FA2 animation controls ---- */
    function toggleAnimation() {
        if (!fa2Layout) return;
        if (fa2Running) {
            stopAnimation();
        } else {
            fa2Layout.start();
            fa2Running = true;
            document.getElementById('btn-toggle').textContent = 'Pause FA2';
            document.getElementById('btn-toggle').classList.add('active');
            document.getElementById('btn-stop').style.display = 'inline-block';
            updateStatus('ForceAtlas2 running');
        }
    }

    function stopAnimation() {
        if (!fa2Layout) return;
        fa2Layout.stop();
        fa2Running = false;
        document.getElementById('btn-toggle').textContent = 'Start FA2';
        document.getElementById('btn-toggle').classList.remove('active');
        document.getElementById('btn-stop').style.display = 'none';
        updateStatus('Layout settled');
    }

    function updateStatus(text) {
        document.getElementById('status-text').textContent = text;
    }

    /* ---- Initialise ---- */
    document.addEventListener('DOMContentLoaded', function() {
        var data = window.graphData;
        if (!data || !data.nodes || data.nodes.length === 0) {
            updateStatus('No graph data');
            return;
        }

        /* Build graphology graph */
        sigmaGraph = new graphology.Graph();

        data.nodes.forEach(function(node) {
            sigmaGraph.addNode(node.id, {
                label: node.label,
                x: node.x,
                y: node.y,
                size: node.size,
                color: node.color,
                entityType: node.entityType,
                degree: node.degree,
                highlighted: true
            });
        });

        data.edges.forEach(function(edge) {
            if (!sigmaGraph.hasEdge(edge.source, edge.target)) {
                sigmaGraph.addEdge(edge.source, edge.target, {
                    color: edge.color,
                    size: 1
                });
            }
        });

        /* Render with Sigma */
        var container = document.getElementById('sigma-container');
        renderer = new Sigma(sigmaGraph, container, {
            renderEdgeLabels: false,
            enableEdgeClickEvents: false,
            defaultNodeColor: '#45B7D1',
            defaultEdgeColor: '#333',
            labelColor: { color: '#ccc' },
            labelFont: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif',
            labelSize: 12,
            labelRenderedSizeThreshold: 6,
            nodeReducer: function(node, data) {
                var res = Object.assign({}, data);
                if (hoveredNeighbours.size > 0 && !hoveredNeighbours.has(node)) {
                    res.color = '#333';
                    res.label = '';
                }
                return res;
            },
            edgeReducer: function(edge, data) {
                var res = Object.assign({}, data);
                if (hoveredNeighbours.size > 0) {
                    var ends = sigmaGraph.extremities(edge);
                    if (!hoveredNeighbours.has(ends[0]) || !hoveredNeighbours.has(ends[1])) {
                        res.hidden = true;
                    }
                }
                return res;
            }
        });

        /* Events */
        renderer.on('enterNode', function(event) {
            hoveredNode = event.node;
            highlightNode(event.node);
            container.style.cursor = 'pointer';
        });

        renderer.on('leaveNode', function() {
            hoveredNode = null;
            if (!selectedNode) resetHighlighting();
            container.style.cursor = 'default';
        });

        renderer.on('clickNode', function(event) {
            selectedNode = event.node;
            highlightNode(event.node);
            showDetails(event.node);
        });

        renderer.on('clickStage', function() {
            hideDetails();
        });

        /* ForceAtlas2 layout */
        fa2Layout = new FA2Layout(sigmaGraph, {
            settings: {
                gravity: 1,
                scalingRatio: 2,
                slowDown: 5,
                barnesHutOptimize: data.nodes.length > 500,
                barnesHutTheta: 0.5
            }
        });

        /* Run synchronous layout by default, animated if configured */
        if (window.sigmaConfig.animated) {
            fa2Layout.start();
            fa2Running = true;
            document.getElementById('btn-toggle').style.display = 'inline-block';
            document.getElementById('btn-toggle').textContent = 'Pause FA2';
            document.getElementById('btn-toggle').classList.add('active');
            document.getElementById('btn-stop').style.display = 'inline-block';
            updateStatus('ForceAtlas2 running');
        } else {
            /* Run synchronous layout passes */
            var settings = {
                gravity: 1,
                scalingRatio: 2,
                slowDown: 5,
                barnesHutOptimize: data.nodes.length > 500,
                barnesHutTheta: 0.5
            };
            var iterations = Math.min(500, Math.max(100, data.nodes.length * 2));
            FA2Layout.assignLayout(sigmaGraph, iterations, settings);
            renderer.refresh();
            document.getElementById('btn-toggle').style.display = 'inline-block';
            updateStatus(data.nodes.length + ' nodes, ' + sigmaGraph.size + ' edges');
        }

        buildLegend();
    });
    </script>
</body>
</html>
