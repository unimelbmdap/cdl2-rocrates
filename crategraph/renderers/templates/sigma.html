<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma.js Network Visualisation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        #sigma-container {
            position: absolute;
            top: 0;
            left: 0;
            width: %(width)s;
            height: %(height)s;
        }

        /* Status bar (bottom-right) */
        #info {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            color: #aaa;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #status {
            white-space: nowrap;
        }

        #info .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: none;
        }

        #info .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        #info .btn.active {
            background: rgba(78, 121, 167, 0.5);
            border-color: rgba(78, 121, 167, 0.7);
            color: #fff;
        }

        #info .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* Type legend (bottom-left) */
        #legend {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #ccc;
            z-index: 1000;
            max-height: 40vh;
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%%;
            flex-shrink: 0;
        }

        /* Node details panel (top-right) */
        #details {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            max-width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            font-size: 13px;
        }

        #details h4 {
            margin: 0 0 10px 0;
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
        }

        .detail-row {
            padding: 3px 0;
            color: #bbb;
        }

        .detail-label {
            font-weight: 600;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="sigma-container"></div>

    <div id="info">
        <span id="status">Initialising&hellip;</span>
        <button id="btn-toggle" class="btn">Start FA2</button>
        <button id="btn-stop" class="btn">Stop</button>
    </div>

    <div id="legend"></div>

    <div id="details"></div>

    <!-- Vendored Sigma.js + graphology + FA2 bundle -->
    <script>%(bundle)s</script>

    <!-- Graph data and config injected by Python renderer -->
    <script>
    window.graphData   = %(graph_data)s;
    window.typeColours = %(type_colours)s;
    window.sigmaConfig = %(config)s;
    </script>
</body>
</html>
