repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # mkdocs.yml uses the !!python/name: tag for Mermaid superfences
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # Scans staged changes and blocks the commit if a credential is detected.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Draft notebooks are scratch work; strip their outputs so re-runs don't churn
  # megabytes of embedded images into git. Scoped to docs/tutorials/draft/ only:
  # mkdocs-jupyter runs with execute: false, so published notebooks must keep
  # their stored outputs or they would render empty.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^docs/tutorials/draft/.*\.ipynb$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        exclude: ^docs/tutorials/draft/
      # Run the formatter
      - id: ruff-format
        exclude: ^docs/tutorials/draft/
